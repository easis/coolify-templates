# NOTA: Hay un error con Coolify o con este archivo. Cuando se introduce en Coolify, el contenido de los archivos
# de credenciales (read.htpasswd y write.htpasswd) no estan separados por saltos de línea sino por espacios.
# Es decir, al crear un contenedor con esta imagen hay que entrar a "Persistent Storage", buscar dichos archivos
# y editar el contenido, separando los usuarios por saltos de línea en lugar de espacios.

# El par usuario:contraseña se genera con este comando:
#   $ docker run --rm --entrypoint htpasswd httpd:2 -Bbn usuario contraseña

services:
  registry:
    image: registry:2.8.2

    volumes:
      - ./registry-data:/var/lib/registry
      # - type: bind
      #   source: ./registry.yml
      #   target: /etc/docker/registry/config.yml
      #   is_directory: false
      - type: bind
        source: ./config/config.yml
        target: /etc/docker/registry/config.yml
        isDirectory: false
        content: >-
          version: 0.1

          log:
            fields:
              service: registry
          storage:
            cache:
              blobdescriptor: inmemory
            filesystem:
              rootdirectory: /var/lib/registry
          http:
            addr: :5000
            headers:
              X-Content-Type-Options: [nosniff]
          health:
            storagedriver:
              enabled: true
              interval: 10s
              threshold: 3
      - type: bind
        source: ./data
        target: /data
        isDirectory: true

    environment:
      REGISTRY_HTTP_HEADERS_Access-Control-Allow-Origin: "['*']"
      REGISTRY_HTTP_HEADERS_Access-Control-Allow-Methods: "[HEAD,GET,OPTIONS,DELETE]"
      REGISTRY_HTTP_HEADERS_Access-Control-Allow-Credentials: "[true]"
      REGISTRY_HTTP_HEADERS_Access-Control-Allow-Headers: "[Authorization,Accept,Cache-Control]"
      REGISTRY_HTTP_HEADERS_Access-Control-Expose-Headers: "[Docker-Content-Digest]"
      REGISTRY_STORAGE_DELETE_ENABLED: "true"

    networks:
      - registry-ui-net

  ui:
    image: joxit/docker-registry-ui:latest
    ports:
      - 5258:80
    environment:
      - SINGLE_REGISTRY=true
      - REGISTRY_TITLE=Contenedores de Enttia
      - REGISTRY_SECURED=false
      - NGINX_PROXY_PASS_URL=https://containers.enttia3000.com
      - DELETE_IMAGES=true
      - SHOW_CONTENT_DIGEST=true
      - SHOW_CATALOG_NB_TAGS=true
      - CATALOG_MIN_BRANCHES=1
      - CATALOG_MAX_BRANCHES=1
      - CATALOG_ELEMENTS_LIMIT=1000
      - TAGLIST_PAGE_SIZE=100
    volumes:
      # Usuario: write, Contraseña: registry
      - type: bind
        source: ./auth/registry.password
        target: /etc/nginx/auth/write.htpasswd
        isDirectory: false
        content: >-
          write:$2y$05$aqLmS1hXojRnubpSN4aVDeZ8wLhJtmQr4v0NiZl4KHUHXhDVnyoQm
      - type: bind
        source: ./auth/registry.password
        target: /etc/nginx/auth/read.htpasswd
        isDirectory: false
        content: >-
          write:$2y$05$aqLmS1hXojRnubpSN4aVDeZ8wLhJtmQr4v0NiZl4KHUHXhDVnyoQm
      - type: bind
        source: ./nginx.conf
        target: /etc/nginx/conf.d/default.conf
        isDirectory: false
        content: >-
          server {
            listen       80;
            server_name  localhost;
            client_max_body_size 0;
            chunked_transfer_encoding on;
            proxy_ssl_server_name on;
            proxy_buffering off;
            proxy_ignore_headers "X-Accel-Buffering";

            location / {
                root   /usr/share/nginx/html;
                index  index.html index.htm;
            }

            location /v2 {
                if ($http_user_agent ~ "^(docker\/1\.(3|4|5(?!\.[0-9]-dev))|Go ).*$" ) {
                    return 404;
                }
                auth_basic "Registry realm";
                auth_basic_user_file /etc/nginx/auth/read.htpasswd;
                limit_except GET HEAD OPTIONS {
                  auth_basic_user_file /etc/nginx/auth/write.htpasswd;
                }

                proxy_set_header X-Real-IP $remote_addr;
                proxy_set_header Host      $http_host;
                proxy_set_header X-Forwarded-Proto https;
                proxy_set_header X-Forwarded-Ssl off;
                proxy_pass http://registry:5000;
            }
            error_page   500 502 503 504  /50x.html;
            location = /50x.html {
                root   /usr/share/nginx/html;
            }
          }

    depends_on:
      - registry
    networks:
      - registry-ui-net

networks:
  registry-ui-net:
